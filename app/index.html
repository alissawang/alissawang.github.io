<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>The Washington Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Roboto', sans-serif;
    }

    /* Phone shell */
    .phone {
      width: 390px;
      min-height: 844px;
      background: #fff;
      border-radius: 48px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 0 0 2px #999;
      overflow: hidden;
      position: relative;
      margin: 24px auto;
      display: flex;
      flex-direction: column;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 6px;
      background: #fff;
    }

    .status-time {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #111;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* App header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px 10px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }

    .wp-logo {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: 26px;
      color: #111;
      letter-spacing: 0px;
      line-height: 1;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notif-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 8px;
      height: 8px;
      background: #e00;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    /* Tab navigation */
    .tabs {
      display: flex;
      align-items: flex-end;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex-shrink: 0;
      padding: 10px 14px 8px;
      font-size: 14px;
      font-weight: 400;
      color: #555;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }

    .tab.active {
      font-weight: 700;
      color: #111;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #111;
    }

    /* Main content */
    .content {
      flex: 1;
      overflow-y: auto;
      background: #fff;
    }

    /* Video card (skeleton) */
    .video-card {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #d8d8d8;
      overflow: hidden;
      max-height: 540px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      gap: 10px;
    }

    .video-card-skel-headline {
      height: 22px;
      width: 68%;
      background: #c4c4c4;
      border-radius: 5px;
    }

    .video-card-skel-headline.short {
      width: 50%;
      height: 18px;
    }

    .video-card-skel-meta {
      height: 10px;
      width: 35%;
      background: #c8c8c8;
      border-radius: 4px;
      margin-top: 2px;
    }

    .video-card-skel-bar {
      height: 2px;
      background: #bbb;
      border-radius: 2px;
      margin-top: 4px;
    }

    /* Bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 20px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.2px;
    }

    .nav-item.active .nav-label {
      color: #111;
    }

    .nav-item.active svg path,
    .nav-item.active svg rect,
    .nav-item.active svg polyline,
    .nav-item.active svg polygon,
    .nav-item.active svg circle,
    .nav-item.active svg line {
      stroke: #111;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }

    /* Page dots below video */
    .page-dots {
      display: flex;
      justify-content: center;
      gap: 5px;
      padding: 8px 0 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccc;
    }

    .dot.active {
      background: #111;
    }

    /* Tag bubbles */
    .tag-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
    }

    .tag-row::-webkit-scrollbar {
      display: none;
    }

    .tag {
      flex-shrink: 0;
      padding: 5px 13px;
      border-radius: 999px;
      border: 1.5px solid #ccc;
      font-size: 12.5px;
      font-weight: 500;
      color: #222;
      background: #fff;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .tag.selected {
      background: #444;
      border-color: #444;
      color: #fff;
    }

    .tag:not(.selected):active {
      background: #f0f0f0;
    }

    /* Feed cards */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .feed-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #efefef;
    }

    .card-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .card-tag-pill {
      width: 60px;
      height: 9px;
      background: #ddd;
      border-radius: 4px;
    }

    .card-headline-line {
      height: 11px;
      background: #e0e0e0;
      border-radius: 4px;
    }

    .card-headline-line.short {
      width: 75%;
    }

    .card-meta-line {
      width: 50%;
      height: 9px;
      background: #ebebeb;
      border-radius: 4px;
    }

    .card-thumb {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
      background: #e0e0e0;
      border-radius: 4px;
    }

    /* Wide image card */
    .feed-card-wide {
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #efefef;
    }

    .card-wide-img {
      width: 100%;
      height: 110px;
      background: #e0e0e0;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-time">08:50</span>
      <div class="status-icons">
        <!-- Signal bars -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0" y="7" width="3" height="5" rx="0.5" fill="#111"/>
          <rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#111"/>
          <rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="#111"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#111"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M8 10a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#111"/>
          <path d="M4.5 7.5a5 5 0 0 1 7 0" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M1.5 4.5a9 9 0 0 1 13 0" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <!-- Battery -->
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#111" stroke-width="1"/>
          <rect x="22" y="3.5" width="2.5" height="5" rx="1" fill="#111"/>
          <rect x="2" y="2" width="17" height="8" rx="1.5" fill="#111"/>
        </svg>
      </div>
    </div>

    <!-- App Header -->
    <div class="app-header">
      <div class="wp-logo">The Washington Post</div>
      <div class="header-icons">
        <!-- Search -->
        <button class="icon-btn" aria-label="Search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="16.5" y1="16.5" x2="22" y2="22"/>
          </svg>
        </button>
        <!-- Notification bell -->
        <button class="icon-btn" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notif-dot"></span>
        </button>
        <!-- Profile -->
        <button class="icon-btn" aria-label="Profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs" role="tablist">
      <div class="tab" role="tab">Top Stories</div>
      <div class="tab active" role="tab" aria-selected="true">For You</div>
      <div class="tab" role="tab">Opinions</div>
      <div class="tab" role="tab">D.C., Md. &amp; Va.</div>
    </div>

    <!-- Tag Bubbles -->
    <div class="tag-row" role="list">
      <div class="tag selected" data-tag="middle-east" role="listitem">Middle East</div>
      <div class="tag selected" data-tag="technology-ai" role="listitem">Technology &amp; AI</div>
      <div class="tag selected" data-tag="dc-md-va" role="listitem">DC/MD/VA</div>
      <div class="tag selected" data-tag="figure-skating" role="listitem">Figure Skating</div>
      <div class="tag selected" data-tag="uplifting" role="listitem">Uplifting</div>
      <div class="tag selected" data-tag="supreme-court" role="listitem">Supreme Court</div>
    </div>

    <!-- Content Area -->
    <div class="content">
      <!-- Video Card (grayed out skeleton) -->
      <div class="video-card" data-tag="middle-east">
        <div class="video-card-skel-headline"></div>
        <div class="video-card-skel-headline short"></div>
        <div class="video-card-skel-meta"></div>
        <div class="video-card-skel-bar"></div>
      </div>

      <!-- Page indicator dots -->
      <div class="page-dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Placeholder feed cards -->
      <div class="feed">

        <!-- Wide image card: Technology & AI -->
        <div class="feed-card feed-card-wide" data-tag="technology-ai">
          <div class="card-wide-img"></div>
          <div class="card-text">
            <div class="card-tag-pill"></div>
            <div class="card-headline-line"></div>
            <div class="card-headline-line short"></div>
            <div class="card-meta-line"></div>
          </div>
        </div>

        <!-- Standard card: DC/MD/VA -->
        <div class="feed-card" data-tag="dc-md-va">
          <div class="card-text">
            <div class="card-tag-pill"></div>
            <div class="card-headline-line"></div>
            <div class="card-headline-line short"></div>
            <div class="card-meta-line"></div>
          </div>
          <div class="card-thumb"></div>
        </div>

        <!-- Standard card: Figure Skating -->
        <div class="feed-card" data-tag="figure-skating">
          <div class="card-text">
            <div class="card-tag-pill"></div>
            <div class="card-headline-line"></div>
            <div class="card-headline-line short"></div>
            <div class="card-meta-line"></div>
          </div>
          <div class="card-thumb"></div>
        </div>

        <!-- Wide image card: Uplifting -->
        <div class="feed-card feed-card-wide" data-tag="uplifting">
          <div class="card-wide-img"></div>
          <div class="card-text">
            <div class="card-tag-pill"></div>
            <div class="card-headline-line"></div>
            <div class="card-headline-line short"></div>
            <div class="card-meta-line"></div>
          </div>
        </div>

        <!-- Standard card: Supreme Court -->
        <div class="feed-card" data-tag="supreme-court">
          <div class="card-text">
            <div class="card-tag-pill"></div>
            <div class="card-headline-line"></div>
            <div class="card-headline-line short"></div>
            <div class="card-meta-line"></div>
          </div>
          <div class="card-thumb"></div>
        </div>

        <!-- Standard card: Middle East (second story) -->
        <div class="feed-card" data-tag="middle-east">
          <div class="card-text">
            <div class="card-tag-pill"></div>
            <div class="card-headline-line"></div>
            <div class="card-headline-line short"></div>
            <div class="card-meta-line"></div>
          </div>
          <div class="card-thumb"></div>
        </div>

      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <!-- Home -->
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 13 15 13 15 21"/>
        </svg>
        <span class="nav-label" style="color:#111;font-weight:700">Home</span>
      </div>
      <!-- Ask -->
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12,2 14.5,9 22,9 16,14 18.5,21 12,16.5 5.5,21 8,14 2,9 9.5,9"/>
        </svg>
        <span class="nav-label">Ask</span>
      </div>
      <!-- Listen -->
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/>
          <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
        </svg>
        <span class="nav-label">Listen</span>
      </div>
      <!-- Watch -->
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span class="nav-label">Watch</span>
      </div>
      <!-- Play -->
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
          <path d="M4 22h16"/>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/>
        </svg>
        <span class="nav-label">Play</span>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', () => {
        const isSelected = tag.classList.toggle('selected');
        const key = tag.dataset.tag;
        document.querySelectorAll('.feed-card, .video-card').forEach(card => {
          if (card.dataset.tag === key) {
            card.style.display = isSelected ? '' : 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
